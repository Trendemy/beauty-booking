version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: beautyuser
      POSTGRES_PASSWORD: beautypass
      POSTGRES_DB: beautydb
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautyuser -d beautydb"]
      interval: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"

  booking-service:
    build: ./booking-service
    environment:
      POSTGRES_USER: beautyuser
      POSTGRES_PASSWORD: beautypass
      POSTGRES_DB: beautydb
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"

  frontend:
    build: ./frontend
    depends_on:
      - booking-service
    ports:
      - "5000:5000"

volumes:
  pgdata:
